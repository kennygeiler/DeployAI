[project]
name = "deployai-ingestlib"
version = "0.0.0"
description = "Shared ingestion helpers for DeployAI services: extraction unit validation (FR16), idempotency keys (FR18), NFR12 retry backoff. Folded in from the retired services/ingest package."
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.3",
  "ruff>=0.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deployai_ingestlib"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["deployai_ingestlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
