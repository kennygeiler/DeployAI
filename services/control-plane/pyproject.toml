[project]
name = "deployai-control-plane"
version = "0.1.0"
description = "DeployAI Control Plane service (FR14, FR17, FR64-68). Scaffold only - routes land in later stories."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.136.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.0.0",
  "sqlalchemy[asyncio]>=2.0.36",
  # Postgres drivers, both runtime. asyncpg: async driver the app connects
  # with (postgresql+asyncpg:// DATABASE_URL). psycopg: sync driver Alembic
  # needs — asyncpg cannot run the multi-statement DDL blocks the migration
  # scripts use. The image shipped with no Postgres driver at all before this.
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "uvicorn[standard]>=0.32.0",
  "python-dotenv>=1.0.1",
  # Story 2-4 — Redis session store + RS256 JWT.
  "redis>=5.0.0",
  "pyjwt[crypto]>=2.9.0",
  "cryptography>=44.0.0",
  # Story 1.9 — shared tenancy primitives (TenantScopedSession + RLS glue).
  "deployai-tenancy",
  "deployai-authz",
  # Story 1.11 — citation envelope Pydantic mirror of @deployai/contracts.
  "deployai-citation",
  "authlib>=1.3.0",
  "httpx>=0.28.0",
  "boto3>=1.35.0",
  "deployai-ingestlib",
  "prometheus-client>=0.21.0",
  "deployai-runtime",
  "deployai-llm-provider-py",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
  "weasyprint>=68.1",
  "jinja2>=3.1.6",
  "markdown>=3.10.2",
  "langgraph>=1.1.9,<2.0",
  # v2 Phase 5.5 — pgvector SQLAlchemy types for the embedding columns
  # on ledger_events / matrix_nodes / oracle_chat_turns / matrix_insights.
  # The extension itself is installed by migration 0050; this Python
  # dependency provides the ``Vector`` type the ORMs map onto.
  "pgvector>=0.3.0",
  "langgraph-checkpoint-postgres>=3.0.0,<4.0",
]

[project.scripts]
# v2 Phase 5.5 Wave B — Voyage-3 embedding backfill worker (scope-v2 §10.2).
# Equivalent to `python -m control_plane.cli.embedder`. The docker-compose
# `embedder` service uses the module form so the entrypoint stays consistent
# whether or not the wheel is installed.
deployai-embedder = "control_plane.cli.embedder:main"

[tool.uv.sources]
deployai-tenancy = { path = "../_shared/tenancy", editable = true }
deployai-authz = { path = "../_shared/authz", editable = true }
deployai-citation = { path = "../_shared/citation", editable = true }
deployai-ingestlib = { path = "../_shared/ingestlib", editable = true }
deployai-runtime = { path = "../_shared/runtime", editable = true }
deployai-llm-provider-py = { path = "../../packages/llm-provider-py", editable = true }

[dependency-groups]
dev = [
  "coverage[toml]>=7.6.0",
  "ruff>=0.7.4",
  "mypy>=1.13.0",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.1",
  # Story 1.8 — integration tests spin up a real pgvector container.
  "testcontainers[postgres]>=4.9.0",
  # Story 1.9 — unit tests for deployai_tenancy.session use in-memory sqlite.
  "aiosqlite>=0.20.0",
  "fakeredis>=2.35.1",
  "moto[s3,sqs]>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["control_plane"]

[[tool.mypy.overrides]]
module = ["deployai_authz", "deployai_authz.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["llm_provider_py", "llm_provider_py.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["authlib", "authlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["deployai_ingestlib", "deployai_ingestlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["prometheus_client", "prometheus_client.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "opentelemetry",
  "opentelemetry.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langgraph", "langgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pgvector ships without a py.typed marker; treat as untyped to stay green.
module = ["pgvector", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Test both the control-plane tree AND the shared packages' tests in one
# invocation (Story 1.9; Wave 0 C2 added authz/runtime/tsa — previously
# dark suites never run by CI). CI `Smoke` → `uv run pytest` covers all
# surfaces without a second invocation or a workspace-level config.
testpaths = [
  "tests",
  "../_shared/tenancy/tests/unit",
  "../_shared/citation/tests",
  "../_shared/authz/tests",
  "../_shared/runtime/tests",
  "../_shared/tsa/tests",
]
# `../_shared/tsa/src` is on pythonpath (not an installed dep) because the
# tsa tests import `deployai_tsa` directly; its only runtime dep (httpx)
# is already in this environment. authz/runtime are installed editable.
pythonpath = ["src", "../_shared/tsa/src"]
# importlib mode is required because both test trees otherwise collide on
# the `tests.unit.test_*` package namespace — control-plane and tenancy
# both have a `tests/unit/__init__.py`. importlib resolves each test file
# independently by path, so duplicate module names are fine.
addopts = "-m 'not integration and not fuzz' --import-mode=importlib"
markers = [
  "integration: requires a reachable Docker daemon (testcontainers)",
  "fuzz: cross-tenant isolation fuzz harness; opt-in via -m fuzz (Story 1.10)",
]

[tool.coverage.run]
branch = true
source = ["src/control_plane"]
omit = ["*/tests/*"]

[tool.coverage.report]
# Wave 0 C1 — coverage floor is a real gate, not theater. Raise over time.
fail_under = 60
show_missing = true
skip_empty = true
precision = 1
