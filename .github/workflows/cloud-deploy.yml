# Auto-deploy to Railway after CI passes on `main` (Wave 0 C3 — deploys
# used to trigger on raw push and race CI; now `workflow_run` gates on
# the CI workflow's success. 2026-08-11: migrated from Fly.io to Railway).
#
# Each deploy is `railway up --service <name>` from the repo root: the CLI
# tarballs the tree (honoring .gitignore) and the service builds with its
# RAILWAY_DOCKERFILE_PATH. Order matters — control-plane runs
# `alembic upgrade head` on boot (RUN_MIGRATIONS=1 in its service vars),
# so Postgres must be up first. The 5 services land in three waves:
#   wave A: postgres (independent)
#   wave B: control-plane (waits for postgres; migrates on boot)
#   wave C: web / mcp-server / embedder (depend on control-plane schema)
#
# Required repo secret:
#   RAILWAY_TOKEN — a project token for the `deployai` Railway project
#                   (Railway dashboard → Project Settings → Tokens), pasted
#                   into Settings → Secrets and variables → Actions → New.
#
# Trigger:
#   - workflow_run on "CI" (branch main, conclusion success) → deploy
#     all 5 iff deploy-relevant paths changed (see `ci-gate` job —
#     `on.paths` filtering is not native to workflow_run, so the path
#     check is done with `git diff` in-job)
#   - workflow_dispatch → manual one-shot from the Actions tab
#     (bypasses the path check, still requires no CI conclusion)

name: cloud-deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Deploy a single service (postgres / control-plane / web / mcp-server / embedder), or leave blank for all"
        required: false
        default: ""

permissions:
  contents: read
  deployments: write # write to the GitHub Deployments API

concurrency:
  group: cloud-deploy
  cancel-in-progress: false # never cancel a live deploy mid-flight

jobs:
  # ------------------------------------------------------------------
  # ci-gate — the only entry point to every deploy job below.
  #   1. Refuses to proceed unless the triggering CI run succeeded
  #      (workflow_dispatch is the manual override path).
  #   2. Re-implements the old `on.paths` filter: workflow_run has no
  #      native path filtering, so we `git diff` the CI run's head SHA
  #      against its first parent. For the squash/merge-commit flow on
  #      `main`, HEAD^1 is exactly the previous `main` tip; for a
  #      multi-commit direct push this under-approximates (only the
  #      last commit is diffed) — acceptable, since workflow_dispatch
  #      covers the rare miss.
  # ------------------------------------------------------------------
  ci-gate:
    name: Gate on CI success + changed paths
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.paths.outputs.deploy }}
      sha: ${{ steps.paths.outputs.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check deploy-relevant paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          # `secrets.*` must not appear in a step `if:` (workflow fails to
          # parse) — resolve presence into an env string here instead.
          HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$HAS_RAILWAY_TOKEN" != "true" ]; then
            # Without the token every `railway up` job fails, stamping a red
            # ✗ deployment on the repo each push. Skip cleanly instead until
            # the RAILWAY_TOKEN repo secret is configured (docs/ops/cloud-deploy.md).
            echo "::notice title=Cloud deploy skipped::RAILWAY_TOKEN secret is not set — CLI deploys remain the path to production."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "workflow_dispatch — deploying unconditionally."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse HEAD^1 >/dev/null 2>&1; then
            echo "No parent commit — deploying to be safe."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD > /tmp/changed.txt
          echo "Changed files:"; cat /tmp/changed.txt
          if grep -qE '^(apps/web/|services/|packages/|infra/compose/postgres/|scripts/cloud-deploy\.sh|\.github/workflows/cloud-deploy\.yml)' /tmp/changed.txt; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No deploy-relevant paths changed — skipping deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  postgres:
    name: Deploy postgres
    needs: ci-gate
    if: ${{ needs.ci-gate.outputs.deploy == 'true' && (github.event.inputs.service == '' || github.event.inputs.service == 'postgres') }}
    runs-on: ubuntu-latest
    environment:
      name: production-postgres
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
          persist-credentials: false
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy postgres
        run: railway up --service postgres --detach --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  control-plane:
    name: Deploy control-plane
    needs: [ci-gate, postgres]
    # `always() && postgres skipped-or-success` preserves the single-service
    # workflow_dispatch flow, so the ci-gate output must be re-checked
    # explicitly here — "postgres skipped" now also happens when the gate
    # itself blocked the run. Downstream jobs (web / mcp-server / embedder)
    # require control-plane success, so they inherit the gate transitively.
    if: ${{ always() && needs.ci-gate.outputs.deploy == 'true' && (needs.postgres.result == 'success' || needs.postgres.result == 'skipped') && (github.event.inputs.service == '' || github.event.inputs.service == 'control-plane') }}
    runs-on: ubuntu-latest
    environment:
      name: production-control-plane
      url: https://control-plane-production-798e.up.railway.app
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
          persist-credentials: false
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy control-plane (runs alembic upgrade head on boot via RUN_MIGRATIONS=1)
        run: railway up --service control-plane --detach --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  embedder:
    name: Deploy embedder
    needs: [ci-gate, control-plane]
    if: ${{ always() && needs.control-plane.result == 'success' && (github.event.inputs.service == '' || github.event.inputs.service == 'embedder') }}
    runs-on: ubuntu-latest
    environment:
      name: production-embedder
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
          persist-credentials: false
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - run: railway up --service embedder --detach --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  mcp-server:
    name: Deploy mcp-server
    needs: [ci-gate, control-plane]
    if: ${{ always() && needs.control-plane.result == 'success' && (github.event.inputs.service == '' || github.event.inputs.service == 'mcp-server') }}
    runs-on: ubuntu-latest
    environment:
      name: production-mcp-server
      url: https://mcp-server-production-d7af.up.railway.app
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
          persist-credentials: false
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - run: railway up --service mcp-server --detach --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  web:
    name: Deploy web
    needs: [ci-gate, control-plane]
    if: ${{ always() && needs.control-plane.result == 'success' && (github.event.inputs.service == '' || github.event.inputs.service == 'web') }}
    runs-on: ubuntu-latest
    environment:
      name: production-web
      url: https://web-production-e4059.up.railway.app
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
          persist-credentials: false
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - run: railway up --service web --detach --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
