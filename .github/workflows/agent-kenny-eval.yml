# Agent Kenny v2 — eval harness CI driver (scope-v2 §11.3, tickets G1/G5).
#
# Invokes the golden-question runner CLI directly — no pytest, no
# markers, no soft-skip. The CLI (tests/golden/agent_kenny/runner.py)
# owns the whole harness: it starts a pgvector testcontainer, migrates,
# seeds BlueState-XL, and drives the FastAPI app in-process. Any step
# failure fails the job.
#
# Cadences:
#   * Nightly 07:00 UTC (midnight PT)  — random 5-question sample,
#     seeded by GITHUB_RUN_ID (reproduce locally: --seed <run_id>)
#   * Mondays 08:00 UTC                — full 30-question set
#   * workflow_dispatch                — operator-picked subset
#
# The cross-engagement-leak gate is the hard-fail (scope-v2 §7.1 — a
# `cross_engagement_leak` is always a tenant-isolation regression). It
# runs UNCONDITIONALLY after the eval step (ticket G5 — the old
# eval_skipped guard meant the gate had never executed).
#
# Without an AGENT_KENNY_EVAL_ANTHROPIC_API_KEY secret the app resolves
# the stub LLM provider: the run still completes and the leak gate still
# executes, but factual questions fail (surfaced honestly in pass_rate)
# — scheduled runs are only meaningful with the secret configured.
#
# The eval report is uploaded as a workflow artifact with 90-day
# retention so a post-mortem can pull per-question detail without
# re-running.
#
# All external actions pinned by 40-char commit SHA to match ci.yml.

name: Agent Kenny eval

on:
  schedule:
    # Nightly 5-question sample at 07:00 UTC (midnight Pacific Time).
    - cron: "0 7 * * *"
    # Weekly full 30-question set Monday 08:00 UTC.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      question_ids:
        description: "Optional CSV of question IDs to run (e.g. q-001,q-007,q-023). Empty = full set."
        required: false
        type: string
        default: ""

# Least-privilege: read for repo contents, no write scopes. Artifact
# upload uses the workflow run's own scope (no `contents: write` needed).
permissions:
  contents: read

concurrency:
  group: agent-kenny-eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  eval:
    name: Run golden questions + cross-engagement gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      # The runner CLI starts its own pgvector testcontainer when no
      # DATABASE_URL is set, so no service containers are needed here.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # Optional repo secret. Absent → stub provider (run completes, leak
      # gate still enforced, factual pass_rate honestly reported as 0).
      ANTHROPIC_API_KEY: ${{ secrets.AGENT_KENNY_EVAL_ANTHROPIC_API_KEY }}
      # Second-tier LLM judge (ticket G4): substring pre-filter first,
      # judge only on substring failures; silently skipped on stub.
      EVAL_LLM_JUDGE: "1"
      REPORT_PATH: ${{ github.workspace }}/eval-report.json

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"
          enable-cache: true

      - name: uv sync (control-plane)
        working-directory: services/control-plane
        run: uv sync

      # Choose the question selection per trigger:
      #   * 07:00 UTC cron → 5 random questions (--limit 5 --random;
      #     the CLI seeds its RNG from GITHUB_RUN_ID automatically)
      #   * 08:00 UTC Mon cron → full 30 (no flags)
      #   * workflow_dispatch with `question_ids` input → explicit CSV
      #   * workflow_dispatch with empty input → full 30
      - name: Resolve runner arguments
        id: args
        env:
          INPUT_QUESTION_IDS: ${{ github.event.inputs.question_ids }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_QUESTION_IDS" ]; then
              echo "runner_args=--question-ids $INPUT_QUESTION_IDS" >> "$GITHUB_OUTPUT"
              echo "selection=manual:$INPUT_QUESTION_IDS" >> "$GITHUB_OUTPUT"
            else
              echo "runner_args=" >> "$GITHUB_OUTPUT"
              echo "selection=manual:full-30" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$SCHEDULE_CRON" = "0 7 * * *" ]; then
            echo "runner_args=--limit 5 --random" >> "$GITHUB_OUTPUT"
            echo "selection=nightly:5-random" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE_CRON" = "0 8 * * 1" ]; then
            echo "runner_args=" >> "$GITHUB_OUTPUT"
            echo "selection=weekly:full-30" >> "$GITHUB_OUTPUT"
          else
            # Defensive default — should not be reachable given the
            # trigger configuration above. Treat as full set.
            echo "runner_args=" >> "$GITHUB_OUTPUT"
            echo "selection=unknown:full-30" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved selection: $(grep '^selection=' "$GITHUB_OUTPUT" | tail -1)"

      # Direct CLI invocation (ticket G1). Non-zero exit fails the job:
      # the CLI exits 1 on transport errors and 2 on a detected
      # cross-engagement leak (the gate below re-checks the report so a
      # leak is flagged even if this step's exit code handling changes).
      - name: Run Agent Kenny golden eval
        working-directory: services/control-plane
        env:
          RUNNER_ARGS: ${{ steps.args.outputs.runner_args }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # RUNNER_ARGS is intentionally word-split
          uv run python -m tests.golden.agent_kenny.runner \
            --report "$REPORT_PATH" \
            $RUNNER_ARGS

      # Hard-fail gate (ticket G5): any cross_engagement_leak_count > 0
      # means a tenant-isolation regression (scope-v2 §7.1). Runs
      # unconditionally — even when the eval step failed — as long as a
      # report exists; a missing report is itself a failure.
      - name: Cross-engagement leak gate
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ ! -s "$REPORT_PATH" ]; then
            echo "::error title=Eval report missing::Expected $REPORT_PATH from the runner but the file is empty or absent."
            exit 1
          fi
          leak_count=$(jq -r '.cross_engagement_leak_count // 0' "$REPORT_PATH")
          echo "cross_engagement_leak_count=$leak_count"
          if [ "$leak_count" -gt 0 ]; then
            echo "::error title=Cross-engagement leak detected — security regression::Runner reported $leak_count cross-engagement citation leak(s). See eval-report artifact. Per scope-v2 §7.1 this is always a real bug; investigate before re-running."
            jq -r '.results[]? | select(.cross_engagement_leak == true) | "  - " + .id' "$REPORT_PATH" || true
            exit 1
          fi
          echo "No cross-engagement leaks detected."

      # Optional Slack alert (ticket G5). No-op unless the
      # AGENT_KENNY_EVAL_SLACK_WEBHOOK_URL secret is configured.
      - name: Alert on failure (Slack webhook)
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.AGENT_KENNY_EVAL_SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELECTION: ${{ steps.args.outputs.selection }}
        run: |
          set -euo pipefail
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No Slack webhook secret configured; skipping alert."
            exit 0
          fi
          payload=$(jq -n --arg url "$RUN_URL" --arg sel "$SELECTION" \
            '{text: ("Agent Kenny eval FAILED (" + $sel + "): " + $url)}')
          curl -sS -X POST -H "Content-Type: application/json" -d "$payload" "$SLACK_WEBHOOK_URL"

      - name: Upload eval report
        if: ${{ always() }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: agent-kenny-eval-${{ github.run_id }}
          path: eval-report.json
          retention-days: 90
          if-no-files-found: warn

  # Longitudinal replay (ticket G3): weekly, alongside the Monday full-30
  # but as its own job so a replay failure is distinguishable from a
  # golden-set failure. Stub provider by design — the degradation gate
  # measures RETRIEVAL quality over corpus growth, and the stub keeps the
  # replay deterministic and free. 3 checkpoints (0.5y / 2y / 5y) keep
  # runtime sane; the full 5-checkpoint sweep is a local/dispatch call.
  #
  # Exit codes are the contract (tests/golden/agent_kenny/longitudinal.py):
  #   2 = cross-engagement leak at any checkpoint (security regression)
  #   3 = pass_rate degraded beyond DEGRADATION_TOLERANCE vs an earlier
  #       (shorter-horizon) checkpoint
  # Either fails this job hard; the report artifact carries per-checkpoint
  # detail for the post-mortem.
  longitudinal:
    name: Longitudinal replay + degradation gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: ${{ github.event.schedule == '0 8 * * 1' || github.event_name == 'workflow_dispatch' }}

    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # Deterministic stub provider — no API key on this job on purpose.
      DEPLOYAI_LLM_PROVIDER: "stub"
      DEGRADATION_TOLERANCE: "0.10"
      LONGITUDINAL_REPORT_PATH: ${{ github.workspace }}/longitudinal-report.json

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"
          enable-cache: true

      - name: uv sync (control-plane)
        working-directory: services/control-plane
        run: uv sync

      - name: Run longitudinal replay
        working-directory: services/control-plane
        run: |
          set -euo pipefail
          uv run python -m tests.golden.agent_kenny.longitudinal \
            --checkpoints 182,730,1825 \
            --questions derived \
            --per-checkpoint 12 \
            --seed 0 \
            --report "$LONGITUDINAL_REPORT_PATH"

      - name: Upload longitudinal report
        if: ${{ always() }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: agent-kenny-longitudinal-${{ github.run_id }}
          path: longitudinal-report.json
          retention-days: 90
          if-no-files-found: warn
